<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Interview Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/recruiter.css">
</head>
<body>
    <!-- Top Navigation -->
    <div class="topnav">
        <div class="topnav-inner">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-users"></i></div>
                <div>
                    <div class="brand-text">HRMS System</div>
                    <div class="brand-sub">Recruitment Module</div>
                </div>
            </div>
            <div class="nav-tabs-hrms">
                <a class="nav-item" href="dashboard-recruiter.html">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a class="nav-item" href="candidates-recruiter.html">
                    <i class="fas fa-user-tie"></i> Candidates
                </a>
                <a class="nav-item" href="requisitions-recruiter.html">
                    <i class="fas fa-briefcase"></i> Requisitions
                </a>
                <a class="nav-item active" href="interviews-recruiter.html">
                    <i class="fas fa-calendar-alt"></i> Interviews
                </a>
                <a class="nav-item" href="offers-recruiter.html">
                    <i class="fas fa-file-contract"></i> Offers
                </a>
            </div>
            <div class="user-chip">
                <div class="user-avatar" id="userAvatar">HR</div>
                <div>
                    <div class="user-name" id="userName">HR Manager</div>
                    <div class="user-role" id="userRole">Recruiter</div>
                </div>
            </div>
            <div class="auth-buttons">
                <button class="btn-logout" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <div class="topbar">
            <div>
                <h1 class="page-title">Interview Management</h1>
                <p class="page-subtitle">Schedule and manage interviews</p>
            </div>
            <button class="btn-primary-hrms" onclick="showScheduleInterviewForm()">
                <i class="fas fa-calendar-plus"></i> Schedule Interview
            </button>
        </div>

        <!-- Add/Edit Form -->
        <div class="card" id="interviewFormCard" style="display:none;">
            <div class="card-head">
                <i class="fas fa-calendar-alt"></i>
                <h6 id="interviewFormTitle">Schedule Interview</h6>
            </div>
            <div class="card-body-inner">
                <form id="interviewForm">
                    <input type="hidden" id="interviewId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Candidate *</label>
                            <select class="form-select" id="interviewCandidateId" required>
                                <option value="">Select Candidate</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Interviewer Name *</label>
                            <input type="text" class="form-control" id="interviewerName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Interview Date & Time *</label>
                            <input type="datetime-local" class="form-control" id="interviewDateTime" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Interview Round *</label>
                            <select class="form-select" id="interviewRound" required>
                                <option value="Technical">Technical</option>
                                <option value="HR">HR</option>
                                <option value="Managerial">Managerial</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Interview Mode *</label>
                            <select class="form-select" id="interviewMode" required>
                                <option value="Online">Online</option>
                                <option value="Offline">Offline</option>
                                <option value="Phone">Phone</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Status *</label>
                            <select class="form-select" id="interviewStatus" required>
                                <option value="SCHEDULED">Scheduled</option>
                                <option value="COMPLETED">Completed</option>
                                <option value="CANCELLED">Cancelled</option>
                                <option value="RESCHEDULED">Rescheduled</option>
                                <option value="NO_SHOW">No Show</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" id="location">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Meeting Link</label>
                            <input type="url" class="form-control" id="meetingLink" placeholder="https://meet.google.com/...">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Remarks</label>
                            <textarea class="form-control" id="interviewRemarks" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn-primary-hrms"><i class="fas fa-save"></i> Schedule Interview</button>
                        <button type="button" class="btn-sm-outline" onclick="cancelInterviewForm()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Interview Table -->
        <div class="card">
            <div class="card-head">
                <i class="fas fa-list"></i>
                <h6>Interview Schedule</h6>
            </div>
            <div class="card-body-inner">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr><th>ID</th><th>Candidate</th><th>Interviewer</th><th>Date & Time</th><th>Round</th><th>Mode</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="interviewTableBody">
                            <tr><td colspan="8" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-box" id="toastBox"></div>

    <script src="../js/recruiter.js"></script>
</body>
</html>
