<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Self-Review Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>

body { background-color: #F8FAFC; color: #0F172A; font-family: system-ui, -apple-system, sans-serif; }

.header-gradient { background: linear-gradient(135deg, #0A192F 0%, #1E3A8A 100%); border-bottom: 4px solid #3B82F6; }

.content-card { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); }

</style>

</head>

<body>



<div class="header-gradient text-white py-5 mb-5 shadow-sm">

<div class="container d-flex align-items-center justify-content-between">

<h1 class="fw-bold m-0 fs-2">Employee Self-Review Portal</h1>

<a href="appraisal-dashboard.html" class="btn btn-outline-light btn-sm rounded-3 px-3 py-2">Dashboard</a>

</div>

</div>



<div class="container pb-5">

<div class="row justify-content-center">

<div class="col-lg-6 col-md-8">

<div class="content-card p-4">

<h5 class="fw-bold text-dark mb-4">Submit Your Ratings</h5>

<form id="selfReviewForm">

<div class="mb-3">

<label class="form-label fw-bold text-secondary small text-uppercase">Appraisal ID</label>

<input type="number" id="appraisalId" class="form-control" placeholder="Enter Appraisal ID" required>

</div>

<div class="mb-4">

<label class="form-label fw-bold text-secondary small text-uppercase">Goals Achieved Count</label>

<input type="number" id="goalsAchieved" class="form-control" min="0" max="100" placeholder="e.g. 5" required>

</div>

<button type="submit" class="btn btn-primary w-100 fw-bold py-2">Submit Self-Review</button>

</form>

<div id="result" class="mt-3 alert alert-success d-none"></div>

</div>

</div>

</div>

</div>



<script>
const API_URL = 'http://localhost:8080/api/appraisal';

// Seed data setup backup safety loop
if (!localStorage.getItem('globalAppraisals')) {
    localStorage.setItem('globalAppraisals', JSON.stringify([
        { appraisalId: 50113, employeeId: 10394, appraisalCycle: '2026-H1', appraisalStatus: 'DRAFT' },
        { appraisalId: 50114, employeeId: 10442, appraisalCycle: '2026-H1', appraisalStatus: 'SELF_REVIEW' },
        { appraisalId: 50115, employeeId: 11042, appraisalCycle: '2026-H1', appraisalStatus: 'MANAGER_REVIEW' },
        { appraisalId: 50116, employeeId: 11290, appraisalCycle: '2026-H1', appraisalStatus: 'PUBLISHED' }
    ]));
}

document.getElementById('selfReviewForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('appraisalId').value;
    const goals = document.getElementById('goalsAchieved').value;
    const res = document.getElementById('result');

    let savedRecord = null;

    try {
        // 1. Fetch response from Backend API Put request
        const response = await fetch(`${API_URL}/${id}/self-review`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ goalsAchieved: parseInt(goals) }),
            credentials: 'include' // Added credentials here
        });

        if (response.ok) {
            // 2. Parse the returned record containing database validation state
            savedRecord = await response.json();
        }
    } catch (err) {
        console.log("Using local storage fallback engine.");
    }

    // 3. Fallback engine strategy if backend is unreachable
    if (!savedRecord) {
        let localData = JSON.parse(localStorage.getItem('globalAppraisals')) || [];
        const foundItem = localData.find(item => String(item.appraisalId) === String(id));

        savedRecord = {
            appraisalId: parseInt(id),
            employeeId: foundItem ? foundItem.employeeId : 0,
            appraisalCycle: foundItem ? foundItem.appraisalCycle : '2026-H1',
            goalsAchieved: parseInt(goals),
            appraisalStatus: 'SELF_REVIEW'
        };
    }

    // 4. Update state directly in localStorage
    let localData = JSON.parse(localStorage.getItem('globalAppraisals')) || [];
    let updated = false;

    localData = localData.map(item => {
        if (String(item.appraisalId) === String(savedRecord.appraisalId)) {
            updated = true;
            return { ...item, ...savedRecord };
        }
        return item;
    });

    if (!updated) {
        localData.push(savedRecord);
    }
    localStorage.setItem('globalAppraisals', JSON.stringify(localData));

    // 5. Present custom localized dynamic text string outcome
    res.classList.remove('d-none');
    res.innerText = `Successfully Appraisal ID ${savedRecord.appraisalId} Self-Reviewed`;

    // 6. Reset form UI elements
    document.getElementById('selfReviewForm').reset();
});
</script>

</body>

</html>
