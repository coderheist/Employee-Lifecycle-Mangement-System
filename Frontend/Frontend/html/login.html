<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Login</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS Link -->
    <link href="../css/login.css" rel="stylesheet">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-header">
                <div class="logo-icon"><i class="bi bi-people-fill"></i></div>
                <h4>HRMS Login</h4>
                <p>HR Management System — Cognizant</p>
            </div>

            <div class="login-body">

                <!-- Error Message Box -->
                <div class="error-box d-none" id="errorBox">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    <span id="errorMsg"></span>
                </div>

                <!-- Form Container -->
                <form id="loginForm">
                    
                    <!-- Username Field -->
                    <div class="mb-3">
                        <label class="form-label" for="username">
                            <i class="bi bi-person-fill me-1 text-primary"></i>Username
                        </label>
                        <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-4">
                        <label class="form-label" for="password">
                            <i class="bi bi-lock-fill me-1 text-primary"></i>Password
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                            <button type="button" class="btn-toggle" id="toggleBtn">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-login" id="loginBtn">
                        <span id="btnText"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
                        <span id="btnSpinner" class="d-none">
                            <span class="spinner-border spinner-border-sm me-2"></span>Signing in...
                        </span>
                    </button>
                </form>

            </div>

            <div class="login-footer">
                &nbsp;·&nbsp; &copy; 2026 Cognizant HRMS
            </div>

        </div>
    </div>

    <!-- External JavaScript Link -->
    <script src="../js/login.js"></script>
</body>
</html>
