<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Job Requisitions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/recruiter.css">
</head>
<body>
    <!-- Top Navigation -->
    <div class="topnav">
        <div class="topnav-inner">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-users"></i></div>
                <div>
                    <div class="brand-text">HRMS System</div>
                    <div class="brand-sub">Recruitment Module</div>
                </div>
            </div>
            <div class="nav-tabs-hrms">
                <a class="nav-item" href="dashboard-recruiter.html">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a class="nav-item" href="candidates-recruiter.html">
                    <i class="fas fa-user-tie"></i> Candidates
                </a>
                <a class="nav-item active" href="requisitions-recruiter.html">
                    <i class="fas fa-briefcase"></i> Requisitions
                </a>
                <a class="nav-item" href="interviews-recruiter.html">
                    <i class="fas fa-calendar-alt"></i> Interviews
                </a>
                <a class="nav-item" href="offers-recruiter.html">
                    <i class="fas fa-file-contract"></i> Offers
                </a>
            </div>
            <div class="user-chip">
                <div class="user-avatar" id="userAvatar">HR</div>
                <div>
                    <div class="user-name" id="userName">HR Manager</div>
                    <div class="user-role" id="userRole">Recruiter</div>
                </div>
            </div>
            <div class="auth-buttons">
                <button class="btn-logout" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <div class="topbar">
            <div>
                <h1 class="page-title">Job Requisitions</h1>
                <p class="page-subtitle">Create and manage job requisitions</p>
            </div>
            <button class="btn-primary-hrms" onclick="showAddRequisitionForm()">
                <i class="fas fa-plus"></i> Create Requisition
            </button>
        </div>

        <!-- Add/Edit Form -->
        <div class="card" id="requisitionFormCard" style="display:none;">
            <div class="card-head">
                <i class="fas fa-briefcase"></i>
                <h6 id="requisitionFormTitle">Create Job Requisition</h6>
            </div>
            <div class="card-body-inner">
                <form id="requisitionForm">
                    <input type="hidden" id="requisitionId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Job Title *</label>
                            <input type="text" class="form-control" id="jobTitle" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Department *</label>
                            <input type="text" class="form-control" id="department" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Number of Positions *</label>
                            <input type="number" class="form-control" id="numberOfPositions" min="1" max="100" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Priority *</label>
                            <select class="form-select" id="priority" required>
                                <option value="LOW">Low</option>
                                <option value="MEDIUM">Medium</option>
                                <option value="HIGH">High</option>
                                <option value="URGENT">Urgent</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Status *</label>
                            <select class="form-select" id="status" required>
                                <option value="OPEN">Open</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="FILLED">Filled</option>
                                <option value="CLOSED">Closed</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Requisition Date *</label>
                            <input type="date" class="form-control" id="requisitionDate" required>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn-primary-hrms"><i class="fas fa-save"></i> Save Requisition</button>
                        <button type="button" class="btn-sm-outline" onclick="cancelRequisitionForm()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Requisition Table -->
        <div class="card">
            <div class="card-head">
                <i class="fas fa-list"></i>
                <h6>Requisition List</h6>
            </div>
            <div class="card-body-inner">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr><th>ID</th><th>Job Title</th><th>Department</th><th>Positions</th><th>Priority</th><th>Status</th><th>Date</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="requisitionTableBody">
                            <tr><td colspan="8" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-box" id="toastBox"></div>

    <script src="../js/recruiter.js"></script>
</body>
</html>
