<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Candidate Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/recruiter.css">
</head>
<body>
    <!-- Top Navigation -->
    <div class="topnav">
        <div class="topnav-inner">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-users"></i></div>
                <div>
                    <div class="brand-text">HRMS System</div>
                    <div class="brand-sub">Recruitment Module</div>
                </div>
            </div>
            <div class="nav-tabs-hrms">
                <a class="nav-item" href="dashboard-recruiter.html">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a class="nav-item active" href="candidates-recruiter.html">
                    <i class="fas fa-user-tie"></i> Candidates
                </a>
                <a class="nav-item" href="requisitions-recruiter.html">
                    <i class="fas fa-briefcase"></i> Requisitions
                </a>
                <a class="nav-item" href="interviews-recruiter.html">
                    <i class="fas fa-calendar-alt"></i> Interviews
                </a>
                <a class="nav-item" href="offers-recruiter.html">
                    <i class="fas fa-file-contract"></i> Offers
                </a>
            </div>
            <div class="user-chip">
                <div class="user-avatar" id="userAvatar">HR</div>
                <div>
                    <div class="user-name" id="userName">HR Manager</div>
                    <div class="user-role" id="userRole">Recruiter</div>
                </div>
            </div>
            <div class="auth-buttons">
                <button class="btn-logout" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <div class="topbar">
            <div>
                <h1 class="page-title">Candidate Management</h1>
                <p class="page-subtitle">Add and manage candidates</p>
            </div>
            <button class="btn-primary-hrms" onclick="showAddCandidateForm()">
                <i class="fas fa-plus"></i> Add Candidate
            </button>
        </div>

        <!-- Add/Edit Form -->
        <div class="card" id="candidateFormCard" style="display:none;">
            <div class="card-head">
                <i class="fas fa-user-plus"></i>
                <h6 id="candidateFormTitle">Add New Candidate</h6>
            </div>
            <div class="card-body-inner">
                <form id="candidateForm">
                    <input type="hidden" id="candidateId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="fullName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Applied Role *</label>
                            <select class="form-select" id="appliedRole" required>
                                <option value="">Select Role</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Experience Years *</label>
                            <input type="number" class="form-control" id="experienceYears" min="0" max="50" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Interview Stage *</label>
                            <input type="text" class="form-control" id="interviewStage" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Status *</label>
                            <select class="form-select" id="candidateStatus" required>
                                <option value="APPLIED">Applied</option>
                                <option value="IN_INTERVIEW">In Interview</option>
                                <option value="OFFERED">Offered</option>
                                <option value="HIRED">Hired</option>
                                <option value="REJECTED">Rejected</option>
                            </select>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn-primary-hrms"><i class="fas fa-save"></i> Save Candidate</button>
                        <button type="button" class="btn-sm-outline" onclick="cancelCandidateForm()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Candidate Table -->
        <div class="card">
            <div class="card-head">
                <i class="fas fa-list"></i>
                <h6>Candidate List</h6>
            </div>
            <div class="card-body-inner">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr><th>ID</th><th>Name</th><th>Role</th><th>Experience</th><th>Stage</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="candidateTableBody">
                            <tr><td colspan="7" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-box" id="toastBox"></div>

    <script src="../js/recruiter.js"></script>
</body>
</html>
