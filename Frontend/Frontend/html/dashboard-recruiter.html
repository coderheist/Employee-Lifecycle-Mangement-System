<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Recruitment Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/recruiter.css">
</head>
<body>
    <!-- Top Navigation -->
    <div class="topnav">
        <div class="topnav-inner">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-users"></i></div>
                <div>
                    <div class="brand-text">HRMS System</div>
                    <div class="brand-sub">Recruitment Module</div>
                </div>
            </div>
            <div class="nav-tabs-hrms">
                <a class="nav-item active" href="dashboard-recruiter.html">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a class="nav-item" href="candidates-recruiter.html">
                    <i class="fas fa-user-tie"></i> Candidates
                </a>
                <a class="nav-item" href="requisitions-recruiter.html">
                    <i class="fas fa-briefcase"></i> Requisitions
                </a>
                <a class="nav-item" href="interviews-recruiter.html">
                    <i class="fas fa-calendar-alt"></i> Interviews
                </a>
                <a class="nav-item" href="offers-recruiter.html">
                    <i class="fas fa-file-contract"></i> Offers
                </a>
            </div>
            <div class="user-chip">
                <div class="user-avatar" id="userAvatar">HR</div>
                <div>
                    <div class="user-name" id="userName">HR Manager</div>
                    <div class="user-role" id="userRole">Recruiter</div>
                </div>
            </div>
            <div class="auth-buttons">
                <button class="btn-logout" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <div class="topbar">
            <div>
                <h1 class="page-title">Recruitment Dashboard</h1>
                <p class="page-subtitle">Overview of recruitment activities</p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body-inner">
                        <div class="leave-chip w-100">
                            <div class="lc-count" id="candidateCount">0</div>
                            <div class="lc-label">Total Candidates</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body-inner">
                        <div class="leave-chip w-100">
                            <div class="lc-count" id="requisitionCount">0</div>
                            <div class="lc-label">Job Requisitions</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body-inner">
                        <div class="leave-chip w-100">
                            <div class="lc-count" id="interviewCount">0</div>
                            <div class="lc-label">Interviews Scheduled</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body-inner">
                        <div class="leave-chip w-100">
                            <div class="lc-count" id="offerCount">0</div>
                            <div class="lc-label">Offers Rolled Out</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-box" id="toastBox"></div>

    <script src="../js/recruiter.js"></script>
</body>
</html>
